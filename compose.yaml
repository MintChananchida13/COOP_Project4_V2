services:
  frontend:
    build: ./project_frontend
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  benchmark:
    profiles: ["benchmark"]
    build: ./benchmark
    init: true
    shm_size: "1gb"
    environment:
      - BENCHMARK_FRONTEND=http://frontend:3000
      - BENCHMARK_EMAIL
      - BENCHMARK_PASSWORD
    volumes:
      - ./benchmark/input:/app/input:ro
      - ./benchmark/output:/app/output
    depends_on:
      frontend:
        condition: service_healthy

  backend:
    build: ./project_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ocr:${POSTGRES_PASSWORD:-ocr-local}@db:5432/ocr_studio}
      GATEWAY_URL: ${GATEWAY_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      EXTERNAL_OCR_ENCRYPTION_KEY: ${EXTERNAL_OCR_ENCRYPTION_KEY:-}
      TEMPLATE_SEED_FILE: ${TEMPLATE_SEED_FILE:-}
    volumes:
      - backend-storage:/app/storage
      - backend-app-storage:/app/app/storage
      - ./template_seed:/template_seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
    restart: unless-stopped

  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ocr_studio
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr-local}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database_seed:/database_seed:ro
      - ./scripts/postgres/restore-database.sh:/docker-entrypoint-initdb.d/10-restore-database.sh:ro
      - ./scripts/postgres/export-database.sh:/usr/local/bin/export-ocr-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test ! -f \"$$PGDATA/.ocr-restore-incomplete\" && pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10m
      retries: 15
    restart: unless-stopped

volumes:
  postgres-data:
  backend-storage:
  backend-app-storage:
